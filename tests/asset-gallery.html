<!doctype html><html lang="ko"><meta charset="utf-8"><title>ABYSS Asset QA</title><style>body{background:#0b2131;color:#d7e9d9;font:12px sans-serif;margin:24px}h1{font-size:20px}section{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:16px 0 26px}article{border:1px solid #36505a;padding:7px;text-align:center}canvas{display:block;image-rendering:pixelated;max-width:100%;margin:auto}small{display:block;color:#91b3ad;margin:4px}#bosses{grid-template-columns:repeat(5,1fr)}</style><h1>ABYSS · 50종 × 일반 / 희귀 변종 · 픽셀 아트 검수</h1><section id="normal"></section><h2>희귀 변종</h2><section id="shiny"></section><h2>해역별 보스</h2><section id="bosses"></section><h2>강화 단계별 장비</h2><section id="gear"></section><script type="module">
import {fishArt,gearArt} from '../src/art.ts';import {bossArt} from '../src/effects.ts';import {species,seas} from '../src/model.ts';
for(const shiny of [false,true])for(const f of species){const a=document.createElement('article');a.append(fishArt(f.shape,f.hue,shiny));const text=document.createElement('small');text.textContent=f.name;a.append(text);document.getElementById(shiny?'shiny':'normal').append(a);}
for(let i=0;i<5;i++){const a=document.createElement('article');a.append(bossArt(i));const t=document.createElement('small');t.textContent=seas[i].boss;a.append(t);document.getElementById('bosses').append(a);}
for(let i=0;i<5;i++)for(const k of ['rod','net']){const a=document.createElement('article');a.append(gearArt(k,i));const t=document.createElement('small');t.textContent=k+' Lv.'+(i+1);a.append(t);document.getElementById('gear').append(a);}
</script></html>
